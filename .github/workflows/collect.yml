name: Collect Snapshots

on:
  schedule:
    # UTC 每 30 分钟; GitHub cron 有 ±几分钟抖动, 采集脚本内含 20 分钟去重
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖与数据库
        run: |
          npm ci
          npx prisma db push

      - name: 采集快照
        run: npx tsx scripts/collect.ts

      - name: 提交快照到仓库
        run: |
          git config user.name "snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add db/history/
          if git diff --cached --quiet; then
            echo "无新数据, 跳过提交"
          else
            git commit -m "chore: snapshot $(date -u +%F_%H:%M UTC)"
            git push
          fi
